plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.16'
}

version = '1.0.0'
group = 'com.bijliguy.commandmanager'

base {
    archivesName = 'CommandManager'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.21'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'commandmanager'

            mods {
                commandmanager {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'commandmanager'

            mods {
                commandmanager {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21-49.0.30'
}

tasks.named('processResources').configure {
    var replaceProperties = [
        minecraft_version: '1.21',
        minecraft_version_range: '[1.21,)',
        forge_version: '49.0.30',
        forge_version_range: '[49.0.30,)',
        loader_version_range: '[1,)'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar').configure {
    manifest {
        attributes([
            'Specification-Title'     : 'commandmanager',
            'Specification-Vendor'    : 'CommandManager',
            'Specification-Version'   : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'CommandManager',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}